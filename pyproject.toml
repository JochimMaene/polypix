[build-system]
requires = ["maturin>=1.10,<2"]
build-backend = "maturin"

[project]
name = "polypix"
dynamic = ["version"]
description = "Fast batch HEALPix rasterization and occupancy reduction for spherical regions."
keywords = ["healpix", "spherical-geometry", "geospatial", "astronomy", "rasterization"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Typing :: Typed",
]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
  { name = "Jochim Maene" },
]
requires-python = ">=3.12"
dependencies = ["numpy>=1.26"]

[project.urls]
Documentation = "https://jochimmaene.github.io/polypix/"
Repository = "https://github.com/JochimMaene/polypix"
Issues = "https://github.com/JochimMaene/polypix/issues"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.maturin]
bindings = "pyo3"
features = ["pyo3/extension-module"]
module-name = "polypix._core"
python-source = "."
strip = true

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[tool.pixi.environments]
default = { features = ["dev", "test"], solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
test = { features = ["dev", "test"], solve-group = "default" }
bench = { features = ["dev", "test", "bench"], solve-group = "default" }
docs = { features = ["dev", "docs"], solve-group = "default" }

[tool.pixi.dependencies]
python = ">=3.12"
numpy = ">=1.26"

[tool.pixi.feature.dev.dependencies]
rust = "*"
maturin = ">=1.10,<2"

[tool.pixi.feature.dev.pypi-dependencies]
polypix = { path = ".", editable = true }

[tool.pixi.feature.dev.pypi-options]
no-build-isolation = ["polypix"]

[tool.pixi.feature.test.dependencies]
mypy = ">=1.15"
pytest = ">=8"
ruff = ">=0.9"

[tool.pixi.feature.bench.dependencies]
pytest-codspeed = ">=5"

[tool.pixi.feature.docs.pypi-dependencies]
sphinx = ">=8.2,<10"
myst-parser = ">=5,<6"
pydata-sphinx-theme = ">=0.16,<1"
sphinx-autobuild = ">=2024.10"
matplotlib = "*"

[tool.pixi.feature.docs.target.linux-64.pypi-dependencies]
astroz = "==0.12.0"

[tool.pixi.feature.docs.system-requirements]
libc = "2.36"

[tool.pixi.tasks]
test = "python -m pytest -q tests"
lint = "ruff check polypix tests benchmarks tools examples && ruff format --check polypix tests benchmarks tools examples && mypy --strict polypix && python -m mypy.stubtest polypix._core"
bench = "python -m pytest benchmarks --codspeed"
wheel = "maturin build --release --out dist"
docs-figures = "MPLBACKEND=Agg MPLCONFIGDIR=.cache/matplotlib python -m examples.documentation_assets"
docs-prepare = { cmd = "sphinx-build -M clean docs site", depends-on = ["docs-figures"] }
docs-build = { cmd = "sphinx-build --fail-on-warning --keep-going -b html docs site", depends-on = ["docs-prepare"] }
docs-serve = { cmd = "sphinx-autobuild --fail-on-warning --watch examples docs site", depends-on = ["docs-prepare"] }
docs-communications = "MPLBACKEND=Agg python examples/communication_constellation.py"
docs-earth-observation = "MPLBACKEND=Agg python examples/earth_observation_constellation.py"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
markers = [
  "parallel: native wall-time benchmark expected to use multiple worker threads",
]
