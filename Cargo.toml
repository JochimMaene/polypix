[package]
name = "polypix"
version = "0.3.0"
edition = "2021"
rust-version = "1.87"
description = "Fast batch HEALPix rasterization and occupancy reduction for spherical regions."
homepage = "https://jochimmaene.github.io/polypix/"
repository = "https://github.com/JochimMaene/polypix"
license = "Apache-2.0"
publish = false
include = [
  "/Cargo.lock",
  "/Cargo.toml",
  "/CHANGELOG.md",
  "/LICENSE",
  "/README.md",
  "/THIRD_PARTY_NOTICES.md",
  "/polypix/*.py",
  "/polypix/*.pyi",
  "/polypix/py.typed",
  "/pyproject.toml",
  "/rust/**",
]

[lib]
name = "_core"
path = "rust/lib.rs"
crate-type = ["cdylib"]

[dependencies]
numpy = "=0.27.1"
pyo3 = { version = "=0.27.2", features = ["abi3-py312", "extension-module"] }
rayon = "=1.12.0"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
