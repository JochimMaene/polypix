name: Build one wheel

on:
  workflow_call:
    inputs:
      label:
        required: true
        type: string
      artifact:
        required: true
        type: string
      artifact_prefix:
        required: true
        type: string
      retention_days:
        required: true
        type: number
      os:
        required: true
        type: string
      target:
        required: true
        type: string
      manylinux:
        required: true
        type: string
      macosx_deployment_target:
        required: false
        default: ""
        type: string
      test_latest_python:
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.label }} wheel
    runs-on: ${{ inputs.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ inputs.macosx_deployment_target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select build and baseline-test Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ inputs.target }}
          manylinux: ${{ inputs.manylinux }}
          args: --release --out dist
          sccache: true

      - name: Install built wheel
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip install numpy pytest
          python -m pip install --no-index --no-deps --find-links "${{ github.workspace }}/dist" polypix

      - name: Test installed wheel on Python 3.12
        working-directory: ${{ runner.temp }}
        run: python -m pytest -q "${{ github.workspace }}/tests"

      - name: Select latest supported Python
        if: inputs.test_latest_python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install built ABI3 wheel on Python 3.14
        if: inputs.test_latest_python
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip install numpy pytest
          python -m pip install --no-index --no-deps --find-links "${{ github.workspace }}/dist" polypix

      - name: Test installed ABI3 wheel on Python 3.14
        if: inputs.test_latest_python
        working-directory: ${{ runner.temp }}
        run: python -m pytest -q "${{ github.workspace }}/tests"

      - name: Upload wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.artifact_prefix }}-${{ inputs.artifact }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
