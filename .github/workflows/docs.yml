name: Publish docs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "examples/**"
      - "polypix/**"
      - "rust/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pyproject.toml"
      - "pixi.lock"
  pull_request:
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "examples/**"
      - "polypix/**"
      - "rust/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pyproject.toml"
      - "pixi.lock"

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          pixi-version: v0.70.1
          cache: false
          run-install: false

      - name: Install docs environment
        env:
          PIXI_CACHE_DIR: ${{ runner.temp }}/pixi-cache
        run: pixi install --locked --environment docs

      - name: Build docs
        env:
          PIXI_CACHE_DIR: ${{ runner.temp }}/pixi-cache
        run: pixi run --environment docs docs-build

      - name: Test documentation examples
        env:
          PIXI_CACHE_DIR: ${{ runner.temp }}/pixi-cache
        run: pixi run --environment docs docs-doctest

      - name: Verify Pages artifact
        if: github.event_name != 'pull_request'
        run: test -s site/index.html

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    name: Deploy docs
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
