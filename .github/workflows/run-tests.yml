name: Run tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx_deployment_target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            macosx_deployment_target: ""
          - os: macos-15-intel
            macosx_deployment_target: "11.0"
          - os: macos-14
            macosx_deployment_target: "11.0"
          - os: windows-latest
            macosx_deployment_target: ""

    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.9.5
        if: runner.os != 'Windows'
        with:
          pixi-version: v0.70.1
          cache: false
          run-install: false

      - name: Install test environment
        if: runner.os != 'Windows'
        env:
          PIXI_CACHE_DIR: ${{ runner.temp }}/pixi-cache
        run: pixi install --locked --environment test

      - name: Run test suite with Pixi
        if: runner.os != 'Windows'
        working-directory: ${{ runner.temp }}
        env:
          PIXI_CACHE_DIR: ${{ runner.temp }}/pixi-cache
        run: pixi run --manifest-path "$GITHUB_WORKSPACE" --environment test python -m pytest -q "$GITHUB_WORKSPACE/tests"

      - name: Select Python on Windows
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust on Windows
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@stable

      - name: Install from source on Windows
        if: runner.os == 'Windows'
        run: python -m pip install ".[test]"

      - name: Run test suite on Windows
        if: runner.os == 'Windows'
        working-directory: ${{ runner.temp }}
        run: python -m pytest -q "$env:GITHUB_WORKSPACE/tests"
