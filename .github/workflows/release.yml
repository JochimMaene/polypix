name: Build and publish

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/build-wheel.yml"
      - "CHANGELOG.md"
      - "Cargo.lock"
      - "Cargo.toml"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "polypix/**"
      - "pyproject.toml"
      - "rust/**"
      - "tests/**"
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build source distribution
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          args: --out dist

      - name: Check metadata
        run: pipx run twine check dist/*

      - name: Upload source distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  build_wheels:
    name: Build ${{ matrix.label }} wheels
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x86-64
            artifact: linux-x86_64
            os: ubuntu-latest
            target: x86_64
            manylinux: "2014"
            macosx_deployment_target: ""
            test_latest_python: true
          - label: Linux ARM64
            artifact: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64
            manylinux: "2014"
            macosx_deployment_target: ""
            test_latest_python: false
          - label: macOS x86-64
            artifact: macos-x86_64
            os: macos-15-intel
            target: x86_64
            manylinux: "off"
            macosx_deployment_target: "11.0"
            test_latest_python: false
          - label: macOS ARM64
            artifact: macos-aarch64
            os: macos-14
            target: aarch64
            manylinux: "off"
            macosx_deployment_target: "11.0"
            test_latest_python: false
          - label: Windows x86-64
            artifact: windows-x86_64
            os: windows-latest
            target: x64
            manylinux: "off"
            macosx_deployment_target: ""
            test_latest_python: false
    uses: ./.github/workflows/build-wheel.yml
    with:
      label: ${{ matrix.label }}
      artifact: ${{ matrix.artifact }}
      artifact_prefix: release
      retention_days: 30
      os: ${{ matrix.os }}
      target: ${{ matrix.target }}
      manylinux: ${{ matrix.manylinux }}
      macosx_deployment_target: ${{ matrix.macosx_deployment_target }}
      test_latest_python: ${{ matrix.test_latest_python }}

  build_wheels_pr_smoke:
    name: PR wheel smoke on ${{ matrix.label }}
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x86-64
            artifact: linux-x86_64
            os: ubuntu-latest
            target: x86_64
            manylinux: "2014"
            macosx_deployment_target: ""
            test_latest_python: true
          - label: macOS ARM64
            artifact: macos-aarch64
            os: macos-14
            target: aarch64
            manylinux: "off"
            macosx_deployment_target: "11.0"
            test_latest_python: false
          - label: Windows x86-64
            artifact: windows-x86_64
            os: windows-latest
            target: x64
            manylinux: "off"
            macosx_deployment_target: ""
            test_latest_python: false
    uses: ./.github/workflows/build-wheel.yml
    with:
      label: ${{ matrix.label }}
      artifact: ${{ matrix.artifact }}
      artifact_prefix: smoke
      retention_days: 7
      os: ${{ matrix.os }}
      target: ${{ matrix.target }}
      manylinux: ${{ matrix.manylinux }}
      macosx_deployment_target: ${{ matrix.macosx_deployment_target }}
      test_latest_python: ${{ matrix.test_latest_python }}

  publish:
    name: Publish to PyPI
    needs: [build_sdist, build_wheels]
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
