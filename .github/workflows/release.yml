name: Build and publish

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "polypix/**"
      - "pyproject.toml"
      - "rust/**"
      - "tests/**"
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Check metadata
        run: pipx run twine check dist/*

      - name: Upload source distribution
        uses: actions/upload-artifact@v4
        with:
          name: release-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  build_wheels:
    name: Build ${{ matrix.label }} wheels
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx_deployment_target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x86-64
            artifact: linux-x86_64
            os: ubuntu-latest
            target: x86_64
            manylinux: "2014"
            macosx_deployment_target: ""
          - label: Linux ARM64
            artifact: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64
            manylinux: "2014"
            macosx_deployment_target: ""
          - label: macOS x86-64
            artifact: macos-x86_64
            os: macos-15-intel
            target: x86_64
            manylinux: "off"
            macosx_deployment_target: "11.0"
          - label: macOS ARM64
            artifact: macos-aarch64
            os: macos-14
            target: aarch64
            manylinux: "off"
            macosx_deployment_target: "11.0"
          - label: Windows x86-64
            artifact: windows-x86_64
            os: windows-latest
            target: x64
            manylinux: "off"
            macosx_deployment_target: ""

    steps:
      - uses: actions/checkout@v4

      - name: Select test Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist --interpreter python
          sccache: true

      - name: Install built wheel
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip install numpy pytest
          python -m pip install --no-index --no-deps --find-links "${{ github.workspace }}/dist" polypix

      - name: Test installed wheel
        working-directory: ${{ runner.temp }}
        run: python -m pytest -q "${{ github.workspace }}/tests"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 30

  build_wheels_pr_smoke:
    name: PR wheel smoke on ${{ matrix.label }}
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx_deployment_target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x86-64
            artifact: linux-x86_64
            os: ubuntu-latest
            target: x86_64
            manylinux: "2014"
            macosx_deployment_target: ""
          - label: macOS ARM64
            artifact: macos-aarch64
            os: macos-14
            target: aarch64
            manylinux: "off"
            macosx_deployment_target: "11.0"
          - label: Windows x86-64
            artifact: windows-x86_64
            os: windows-latest
            target: x64
            manylinux: "off"
            macosx_deployment_target: ""

    steps:
      - uses: actions/checkout@v4

      - name: Select smoke-test Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build smoke wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist --interpreter python
          sccache: true

      - name: Install smoke wheel
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip install numpy pytest
          python -m pip install --no-index --no-deps --find-links "${{ github.workspace }}/dist" polypix

      - name: Test installed wheel
        working-directory: ${{ runner.temp }}
        run: python -m pytest -q "${{ github.workspace }}/tests"

      - name: Upload smoke wheel
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.artifact }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: [build_sdist, build_wheels]
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
