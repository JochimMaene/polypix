name: Build and publish

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "ci/**"
      - "CMakeLists.txt"
      - "pixi.lock"
      - "polypix/**"
      - "pyproject.toml"
      - "src/polypix/**"
      - "tests/**"
  release:
    types: [published]

jobs:
  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build sdist
        run: pipx run build --sdist

      - name: Check metadata
        run: pipx run twine check dist/*

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: release-sdist
          path: dist/*.tar.gz
          retention-days: 30

  build_wheels:
    name: Build wheel on ${{ matrix.os }} ${{ matrix.arch }}
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: macos-15-intel
            arch: x86_64
            macosx_deployment_target: "11.0"
          - os: macos-14
            arch: arm64
            macosx_deployment_target: "11.0"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install locked wheel dependencies
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.70.1
          pixi-bin-path: ${{ runner.temp }}/pixi-bin/pixi
          manifest-path: pyproject.toml
          environments: ${{ runner.os != 'Linux' && 'wheel-deps' || '' }}
          run-install: ${{ runner.os != 'Linux' }}
          locked: ${{ runner.os != 'Linux' }}
          cache: ${{ runner.os != 'Linux' }}

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.0
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BUILD: "cp312-* cp313-* cp314-*"
          CIBW_BEFORE_ALL_LINUX: >-
            /host${{ runner.temp }}/pixi-bin/pixi install
            --manifest-path /project/pyproject.toml
            --environment wheel-deps
            --locked
          CIBW_ENVIRONMENT_LINUX:
            POLYPIX_DEPS_PREFIX='/project/.pixi/envs/wheel-deps'
            CMAKE_PREFIX_PATH='/project/.pixi/envs/wheel-deps'
            PKG_CONFIG_PATH='/project/.pixi/envs/wheel-deps/lib/pkgconfig'
            PATH="/project/.pixi/envs/wheel-deps/bin:$PATH"
            LDFLAGS='-static-libstdc++'
          CIBW_ENVIRONMENT_MACOS:
            POLYPIX_DEPS_PREFIX='${{ github.workspace }}/.pixi/envs/wheel-deps'
            CMAKE_PREFIX_PATH='${{ github.workspace }}/.pixi/envs/wheel-deps'
            PKG_CONFIG_PATH='${{ github.workspace }}/.pixi/envs/wheel-deps/lib/pkgconfig'
            PATH="${{ github.workspace }}/.pixi/envs/wheel-deps/bin:$PATH"
            MACOSX_DEPLOYMENT_TARGET='${{ matrix.macosx_deployment_target }}'

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse/*.whl
          retention-days: 30

  build_wheels_pr_smoke:
    name: PR wheel smoke on ${{ matrix.os }} ${{ matrix.arch }}
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: macos-14
            arch: arm64
            macosx_deployment_target: "11.0"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install locked wheel dependencies
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.70.1
          pixi-bin-path: ${{ runner.temp }}/pixi-bin/pixi
          manifest-path: pyproject.toml
          environments: ${{ runner.os != 'Linux' && 'wheel-deps' || '' }}
          run-install: ${{ runner.os != 'Linux' }}
          locked: ${{ runner.os != 'Linux' }}
          cache: ${{ runner.os != 'Linux' }}

      - name: Build smoke wheels
        uses: pypa/cibuildwheel@v3.4.0
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BUILD: "cp312-* cp314-*"
          CIBW_BEFORE_ALL_LINUX: >-
            /host${{ runner.temp }}/pixi-bin/pixi install
            --manifest-path /project/pyproject.toml
            --environment wheel-deps
            --locked
          CIBW_ENVIRONMENT_LINUX:
            POLYPIX_DEPS_PREFIX='/project/.pixi/envs/wheel-deps'
            CMAKE_PREFIX_PATH='/project/.pixi/envs/wheel-deps'
            PKG_CONFIG_PATH='/project/.pixi/envs/wheel-deps/lib/pkgconfig'
            PATH="/project/.pixi/envs/wheel-deps/bin:$PATH"
            LDFLAGS='-static-libstdc++'
          CIBW_ENVIRONMENT_MACOS:
            POLYPIX_DEPS_PREFIX='${{ github.workspace }}/.pixi/envs/wheel-deps'
            CMAKE_PREFIX_PATH='${{ github.workspace }}/.pixi/envs/wheel-deps'
            PKG_CONFIG_PATH='${{ github.workspace }}/.pixi/envs/wheel-deps/lib/pkgconfig'
            PATH="${{ github.workspace }}/.pixi/envs/wheel-deps/bin:$PATH"
            MACOSX_DEPLOYMENT_TARGET='${{ matrix.macosx_deployment_target }}'

      - name: Upload smoke wheels
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse/*.whl
          retention-days: 7

  upload_all:
    name: Publish to PyPI
    needs: [build_sdist, build_wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
