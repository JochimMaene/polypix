name: Benchmarks

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: CodSpeed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          pixi-version: v0.70.1
          cache: false
          run-install: false

      - name: Install benchmark environment
        env:
          PIXI_CACHE_DIR: ${{ runner.temp }}/pixi-cache
        run: pixi install --locked --environment bench

      - name: Verify benchmark import
        working-directory: ${{ runner.temp }}
        env:
          PIXI_CACHE_DIR: ${{ runner.temp }}/pixi-cache
        run: |
          pixi run --manifest-path "$GITHUB_WORKSPACE" --environment bench python - <<'PY'
          import polypix
          import polypix._core

          print(polypix.__file__)
          PY

      - name: Run benchmarks
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        env:
          PIXI_CACHE_DIR: ${{ runner.temp }}/pixi-cache
        with:
          mode: simulation
          run: cd "$RUNNER_TEMP" && pixi run --manifest-path "$GITHUB_WORKSPACE" --environment bench python -m pytest "$GITHUB_WORKSPACE/benchmarks" --codspeed -m "not parallel"

      - name: Check native parallel scaling
        working-directory: ${{ runner.temp }}
        env:
          PIXI_CACHE_DIR: ${{ runner.temp }}/pixi-cache
        run: pixi run --manifest-path "$GITHUB_WORKSPACE" --environment bench python "$GITHUB_WORKSPACE/tools/check_parallel_speedup.py"
